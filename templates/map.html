<h2 style="color:#1e3a5f; margin-bottom:16px;"><i class="fas fa-map-marked-alt"></i> 救援地圖</h2>
<div id="mapMessage" class="message"></div>

<div class="summary-enhanced">
    <div class="status-counter waiting"><div class="counter-number" id="mapWaiting">0</div><div class="counter-label"><span class="status-indicator" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;"></span>等待救援</div><div class="cabin-numbers" id="mapWaitingCabins"></div></div>
    <div class="status-counter rescuing"><div class="counter-number" id="mapRescuing">0</div><div class="counter-label"><span class="status-indicator" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#eab308;"></span>救援中</div><div class="cabin-numbers" id="mapRescuingCabins"></div></div>
    <div class="status-counter landed"><div class="counter-number" id="mapLanded">0</div><div class="counter-label"><span class="status-indicator" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;"></span>已著陸</div><div class="cabin-numbers" id="mapLandedCabins"></div></div>
</div>

<div class="map-toolbar">
    <textarea id="seqInput" placeholder="輸入車廂號碼 (逗號或空格分隔)"></textarea>
    <button onclick="mapApplySequences()" style="background:#2563eb;color:white;">套用</button>
    <input type="text" id="mapSearchBox" placeholder="搜尋車廂" style="min-width:100px;">
    <button onclick="mapSearchCabin()" style="background:#2563eb;color:white;">搜尋</button>
    <button onclick="mapClearAll()" style="background:#dc2626;color:white;">清除所有</button>
    <button id="exportCsvBtn" style="background:#22c55e;color:white;">匯出 CSV</button>
    <button id="moveToggleBtn" style="background:#e2e8f0;color:#1e293b;">啟用移動</button>
    <button onclick="mapManualRefresh()" style="background:#2563eb;color:white;">
    <i class="fas fa-sync-alt"></i> 刷新地圖
</button>
    <button id="mapToggleBtn" style="background:#e2e8f0;color:#1e293b;">切換到 109 車廂</button>
    <span id="modeLabel" style="font-weight:500;">模式: 84 車廂</span>
</div>

<svg id="map" viewBox="0 0 4000 700">
    <defs>
        <linearGradient id="gradMountain" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#388E3C"/><stop offset="100%" stop-color="#A5D6A7"/></linearGradient>
        <linearGradient id="gradBay" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#81D4FA"/><stop offset="100%" stop-color="#0288D1"/></linearGradient>
        <filter id="highlightGlow"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="gold"/></filter>
        <g id="towerSymbol"><line x1="-20" y1="0" x2="0" y2="-100" stroke="#444" stroke-width="6"/><line x1="20" y1="0" x2="0" y2="-100" stroke="#444" stroke-width="6"/><line x1="-15" y1="-30" x2="15" y2="-30" stroke="#444" stroke-width="4"/><line x1="-10" y1="-60" x2="10" y2="-60" stroke="#444" stroke-width="3"/><rect x="-30" y="-110" width="60" height="12" fill="#999" stroke="#222"/><rect x="-25" y="0" width="50" height="10" fill="#555"/></g>
        <g id="stationSymbol"><rect x="-50" y="-20" width="100" height="20" fill="#9e9e9e" stroke="#333"/><polygon points="-60,-70 60,-70 40,-20 -40,-20" fill="#bdbdbd" stroke="#222"/><rect x="-35" y="-55" width="15" height="20" fill="#eee" stroke="#222"/><rect x="-7" y="-55" width="15" height="20" fill="#eee" stroke="#222"/><rect x="21" y="-55" width="15" height="20" fill="#eee" stroke="#222"/><line x1="0" y1="-70" x2="0" y2="-100" stroke="#757575" stroke-width="3"/><circle cx="0" cy="-100" r="6" fill="#616161" stroke="#222"/></g>
    </defs>
    <g id="svgSummary" transform="translate(700,0)"><rect x="0" y="0" width="600" height="90" rx="12"/><text id="waitingText" x="200" y="45" font-size="34" font-weight="bold" text-anchor="middle">等待: 0</text><text id="landedText" x="420" y="45" font-size="34" font-weight="bold" text-anchor="middle">已著陸: 0</text></g>
    <!-- ★ 圖例已更新加入藍色 -->
    <g id="legend" transform="translate(1600,460)">
        <rect x="0" y="0" width="320" height="280" fill="white" stroke="#333" rx="8"/>
        <text x="160" y="40" font-size="40" font-weight="bold" text-anchor="middle">車廂狀態</text>
        <!-- 已著陸 綠 -->
        <g transform="translate(25,60)">
            <rect width="26" height="26" fill="#22c55e" stroke="#333"/>
            <text x="40" y="19" font-size="30">已著陸</text>
        </g>
        <!-- 已離開 藍 -->
        <g transform="translate(25,100)">
            <rect width="26" height="26" fill="#3b82f6" stroke="#333"/>
            <text x="40" y="19" font-size="30">已離開</text>
        </g>
        <!-- 救援中 黃 -->
        <g transform="translate(25,140)">
            <rect width="26" height="26" fill="#eab308" stroke="#333"/>
            <text x="40" y="19" font-size="30">救援中</text>
        </g>
        <!-- 等待救援 紅 -->
        <g transform="translate(25,180)">
            <rect width="26" height="26" fill="#dc2626" stroke="#333"/>
            <text x="40" y="19" font-size="30">等待救援</text>
        </g>
        <!-- 無記錄 灰 -->
        <g transform="translate(25,220)">
            <rect width="26" height="26" fill="#e2e8f0" stroke="#333"/>
            <text x="40" y="19" font-size="30">無組別記錄</text>
        </g>
    </g>
</svg>
