<h2 style="color:#1e3a5f; margin-bottom:16px;"><i class="fas fa-map-marked-alt"></i> 救援地圖</h2>
<div id="mapMessage" class="message"></div>

<!-- ★ 置頂標籤已刪除，地圖向上移動 -->

<div class="map-toolbar">
    <textarea id="seqInput" placeholder="輸入車廂號碼 (逗號或空格分隔)"></textarea>
    <button onclick="mapApplySequences()" style="background:#2563eb;color:white;">套用</button>
    <input type="text" id="mapSearchBox" placeholder="搜尋車廂" style="min-width:100px;">
    <button onclick="mapSearchCabin()" style="background:#2563eb;color:white;">搜尋</button>
    <button onclick="mapClearAll()" style="background:#dc2626;color:white;">清除所有</button>
    <button id="exportCsvBtn" style="background:#22c55e;color:white;">匯出 CSV</button>
    <button onclick="mapManualRefresh()" style="background:#2563eb;color:white;">
        <i class="fas fa-sync-alt"></i> 刷新地圖
    </button>
    <button id="moveToggleBtn" style="background:#e2e8f0;color:#1e293b;">啟用移動</button>
    <button id="mapToggleBtn" style="background:#e2e8f0;color:#1e293b;">切換到 109 車廂</button>
    <span id="modeLabel" style="font-weight:500;">模式: 84 車廂</span>
</div>

<!-- ★ 地圖與表格容器（flex 4:6） -->
<div class="map-content-container">
    <!-- 地圖區 (40%) -->
    <div class="map-svg-wrapper">
        <svg id="map" viewBox="0 0 4000 700">
            <defs>
                <linearGradient id="gradMountain" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0%" stop-color="#388E3C"/>
                    <stop offset="100%" stop-color="#A5D6A7"/>
                </linearGradient>
                <linearGradient id="gradBay" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#81D4FA"/>
                    <stop offset="100%" stop-color="#0288D1"/>
                </linearGradient>
                <filter id="highlightGlow">
                    <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="gold"/>
                </filter>
                <g id="towerSymbol">
                    <line x1="-20" y1="0" x2="0" y2="-100" stroke="#444" stroke-width="6"/>
                    <line x1="20" y1="0" x2="0" y2="-100" stroke="#444" stroke-width="6"/>
                    <line x1="-15" y1="-30" x2="15" y2="-30" stroke="#444" stroke-width="4"/>
                    <line x1="-10" y1="-60" x2="10" y2="-60" stroke="#444" stroke-width="3"/>
                    <rect x="-30" y="-110" width="60" height="12" fill="#999" stroke="#222"/>
                    <rect x="-25" y="0" width="50" height="10" fill="#555"/>
                </g>
                <g id="stationSymbol">
                    <rect x="-50" y="-20" width="100" height="20" fill="#9e9e9e" stroke="#333"/>
                    <polygon points="-60,-70 60,-70 40,-20 -40,-20" fill="#bdbdbd" stroke="#222"/>
                    <rect x="-35" y="-55" width="15" height="20" fill="#eee" stroke="#222"/>
                    <rect x="-7" y="-55" width="15" height="20" fill="#eee" stroke="#222"/>
                    <rect x="21" y="-55" width="15" height="20" fill="#eee" stroke="#222"/>
                    <line x1="0" y1="-70" x2="0" y2="-100" stroke="#757575" stroke-width="3"/>
                    <circle cx="0" cy="-100" r="6" fill="#616161" stroke="#222"/>
                </g>
            </defs>
            
            <!-- ★ 地圖內部摘要 -->
            <g id="svgSummary" transform="translate(700,0)">
                <rect x="0" y="0" width="600" height="90" rx="12" fill="white" stroke="#ccc"/>
                <g transform="translate(30, 20)">
                    <rect x="0" y="0" width="24" height="24" fill="#dc2626" rx="4"/>
                    <text x="32" y="18" font-size="20" fill="#333">等待救援</text>
                    <text x="140" y="18" font-size="20" font-weight="bold" fill="#dc2626" id="mapWaitingSvg">0</text>
                </g>
                <g transform="translate(230, 20)">
                    <rect x="0" y="0" width="24" height="24" fill="#eab308" rx="4"/>
                    <text x="32" y="18" font-size="20" fill="#333">救援中</text>
                    <text x="120" y="18" font-size="20" font-weight="bold" fill="#eab308" id="mapRescuingSvg">0</text>
                </g>
                <g transform="translate(430, 20)">
                    <rect x="0" y="0" width="24" height="24" fill="#22c55e" rx="4"/>
                    <text x="32" y="18" font-size="20" fill="#333">已著陸</text>
                    <text x="120" y="18" font-size="20" font-weight="bold" fill="#22c55e" id="mapLandedSvg">0</text>
                </g>
            </g>
            
            <!-- ★ 圖例 -->
            <g id="legend" transform="translate(1600,460)">
                <rect x="0" y="0" width="320" height="280" fill="white" stroke="#333" rx="8"/>
                <text x="160" y="40" font-size="40" font-weight="bold" text-anchor="middle">車廂狀態</text>
                <g transform="translate(25,60)">
                    <rect width="26" height="26" fill="#22c55e" stroke="#333"/>
                    <text x="40" y="19" font-size="30">已著陸</text>
                </g>
                <g transform="translate(25,100)">
                    <rect width="26" height="26" fill="#3b82f6" stroke="#333"/>
                    <text x="40" y="19" font-size="30">已離開</text>
                </g>
                <g transform="translate(25,140)">
                    <rect width="26" height="26" fill="#eab308" stroke="#333"/>
                    <text x="40" y="19" font-size="30">救援中</text>
                </g>
                <g transform="translate(25,180)">
                    <rect width="26" height="26" fill="#dc2626" stroke="#333"/>
                    <text x="40" y="19" font-size="30">等待救援</text>
                </g>
                <g transform="translate(25,220)">
                    <rect width="26" height="26" fill="#e2e8f0" stroke="#333"/>
                    <text x="40" y="19" font-size="30">無組別記錄</text>
                </g>
            </g>
        </svg>
    </div>

    <!-- ★ 下方表格區 (60%) -->
    <div class="map-tables-container">
        <!-- 救援記錄 (60%) -->
        <div class="map-table-panel" style="flex: 6;">
            <div class="map-table-header">
                <span class="map-table-title"><i class="fas fa-clipboard-list"></i> 救援記錄</span>
                <div class="map-table-toolbar">
                    <input type="text" id="mapRescueSearch" placeholder="綜合搜尋" oninput="mapFilterRescueTable()" style="min-width:100px;">
                    <input type="text" id="mapRescueCabinSearch" placeholder="車廂號碼(精確)" oninput="mapFilterRescueTable()" style="min-width:120px; border-color:#3b82f6;">
                    <button onclick="mapRefreshTables()" class="btn-refresh">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                </div>
            </div>
            <div class="table-wrap" id="mapRescueTableWrap">
                <table>
                    <thead>
                        <tr>
                            <th>車廂</th>
                            <th>組別</th>
                            <th>開始</th>
                            <th>結束</th>
                            <th>狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="mapRescueTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- OCC 求助記錄 (40%) -->
        <div class="map-table-panel" style="flex: 4;">
            <div class="map-table-header">
                <span class="map-table-title"><i class="fas fa-headset"></i> OCC 求助記錄</span>
                <div class="map-table-toolbar">
                    <input type="text" id="mapOccSearch" placeholder="綜合搜尋" oninput="mapFilterOccTable()" style="min-width:100px;">
                    <input type="text" id="mapOccCabinSearch" placeholder="車廂號碼(精確)" oninput="mapFilterOccTable()" style="min-width:120px; border-color:#3b82f6;">
                    <button onclick="mapRefreshTables()" class="btn-refresh">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                </div>
            </div>
            <!-- ★ 提示欄放置於此（OCC 表格欄位上方） -->
            <div id="matchAlertContainer"></div>
            <div class="table-wrap" id="mapOccTableWrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width:40px;">#</th>
                            <th>車廂</th>
                            <th>姓名</th>
                            <th>健康狀況</th>
                            <th>狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="mapOccTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
