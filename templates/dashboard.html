<h2 style="color:#1e3a5f; margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    <span><i class="fas fa-chart-line"></i> 監控面板</span>
    <span class="db-total-badge">總計 <b id="dbKpiTotal">0</b> 筆</span>
</h2>
<div id="dbMessage" class="message"></div>

<!-- ===== Layer 1：Hero KPIs（4 個狀態） ===== -->
<div class="db-hero-grid">
    <div class="db-hero-card" style="border-left-color: #dc2626;">
        <div class="db-hero-icon" style="color:#dc2626;"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="db-hero-content">
            <div class="db-hero-number" style="color:#dc2626;" id="dbKpiWaiting">0</div>
            <div class="db-hero-label">等待救援</div>
            <div class="db-hero-sub" id="dbKpiWaitingPct">0%</div>
        </div>
    </div>

    <div class="db-hero-card" style="border-left-color: #eab308;">
        <div class="db-hero-icon" style="color:#eab308;"><i class="fas fa-spinner"></i></div>
        <div class="db-hero-content">
            <div class="db-hero-number" style="color:#eab308;" id="dbKpiRescuing">0</div>
            <div class="db-hero-label">救援中</div>
            <div class="db-hero-sub" id="dbKpiRescuingPct">0%</div>
        </div>
    </div>

    <div class="db-hero-card" style="border-left-color: #22c55e;">
        <div class="db-hero-icon" style="color:#22c55e;"><i class="fas fa-check-circle"></i></div>
        <div class="db-hero-content">
            <div class="db-hero-number" style="color:#22c55e;" id="dbKpiLanded">0</div>
            <div class="db-hero-label">已著陸</div>
            <div class="db-hero-sub" id="dbKpiLandedPct">0%</div>
        </div>
    </div>

    <div class="db-hero-card" style="border-left-color: #3b82f6;">
        <div class="db-hero-icon" style="color:#3b82f6;"><i class="fas fa-sign-out-alt"></i></div>
        <div class="db-hero-content">
            <div class="db-hero-number" style="color:#3b82f6;" id="dbKpiDeparted">0</div>
            <div class="db-hero-label">已離開</div>
            <div class="db-hero-sub" id="dbKpiDepartedPct">0%</div>
        </div>
    </div>
</div>

<!-- ===== Layer 2：健康分佈條 ===== -->
<div class="db-health-bar-card">
    <div class="db-health-bar-title">
        <i class="fas fa-heartbeat"></i> 健康狀況分佈
        <span class="db-health-bar-total" id="dbHealthTotal">0 人</span>
    </div>
    <div class="db-health-bar">
        <div class="db-health-segment db-health-red" id="dbSegRed" style="width:0%;">
            <span class="db-health-seg-label" id="dbSegRedLabel"></span>
        </div>
        <div class="db-health-segment db-health-yellow" id="dbSegYellow" style="width:0%;">
            <span class="db-health-seg-label" id="dbSegYellowLabel"></span>
        </div>
        <div class="db-health-segment db-health-green" id="dbSegGreen" style="width:0%;">
            <span class="db-health-seg-label" id="dbSegGreenLabel"></span>
        </div>
        <div class="db-health-segment db-health-black" id="dbSegBlack" style="width:0%;">
            <span class="db-health-seg-label" id="dbSegBlackLabel"></span>
        </div>
        <div class="db-health-segment db-health-unknown" id="dbSegUnknown" style="width:0%;">
            <span class="db-health-seg-label" id="dbSegUnknownLabel"></span>
        </div>
    </div>
    <div class="db-health-legend">
        <span><i class="db-dot" style="background:#dc2626;"></i>紅色 <b id="dbLegRed">0</b></span>
        <span><i class="db-dot" style="background:#eab308;"></i>黃色 <b id="dbLegYellow">0</b></span>
        <span><i class="db-dot" style="background:#22c55e;"></i>綠色 <b id="dbLegGreen">0</b></span>
        <span><i class="db-dot" style="background:#1e293b;"></i>黑色 <b id="dbLegBlack">0</b></span>
        <span><i class="db-dot" style="background:#94a3b8;"></i>未分類 <b id="dbLegUnknown">0</b></span>
    </div>
</div>

<!-- ===== Layer 3：輔助指標 ===== -->
<div class="db-aux-grid">
    <div class="db-aux-card">
        <div class="db-aux-icon" style="background:#fef3c7; color:#92400e;"><i class="fas fa-ambulance"></i></div>
        <div class="db-aux-content">
            <div class="db-aux-number" id="dbAuxAmbulance">0</div>
            <div class="db-aux-label">需救護車</div>
        </div>
    </div>
    <div class="db-aux-card">
        <div class="db-aux-icon" style="background:#fee2e2; color:#dc2626;"><i class="fas fa-hourglass-half"></i></div>
        <div class="db-aux-content">
            <div class="db-aux-number" id="dbAuxLongestWait">—</div>
            <div class="db-aux-label">最久等待（分鐘）</div>
        </div>
    </div>
    <div class="db-aux-card">
        <div class="db-aux-icon" style="background:#dbeafe; color:#2563eb;"><i class="fas fa-stopwatch"></i></div>
        <div class="db-aux-content">
            <div class="db-aux-number" id="dbAuxAvgRescue">—</div>
            <div class="db-aux-label">平均救援（分鐘）</div>
        </div>
    </div>
    <div class="db-aux-card">
        <div class="db-aux-icon" style="background:#dcfce7; color:#16a34a;"><i class="fas fa-calendar-check"></i></div>
        <div class="db-aux-content">
            <div class="db-aux-number" id="dbAuxTodayDone">0</div>
            <div class="db-aux-label">今日完成</div>
        </div>
    </div>
</div>

<!-- ===== 原有篩選 + 表格（保留） ===== -->
<div class="card">
    <div class="filter-row">
        <div class="form-group"><label>搜尋</label><input type="text" id="dbSearch" placeholder="車廂或姓名" oninput="dbFilterRecords()"></div>
        <div class="form-group"><label>後續處理</label>
            <select id="dbFilterExit" onchange="dbFilterRecords()">
                <option value="">全部</option>
                <option value="正常或傷勢已處理 自行離開">自行離開</option>
                <option value="現正在救援集合點休息中">休息中</option>
                <option value="已由救護車送往醫院">送醫</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-group"><label>健康狀況</label>
            <select id="dbFilterHealth" onchange="dbFilterRecords()">
                <option value="">全部</option>
                <option value="綠色(第三優先)">綠色</option>
                <option value="黃色(第二優先)">黃色</option>
                <option value="紅色(第一優先)">紅色</option>
                <option value="黑色(沒有生命體徵)">黑色</option>
            </select>
        </div>
        <div class="form-group"><label>狀態</label>
            <select id="dbFilterStatus" onchange="dbFilterRecords()">
                <option value="">全部</option>
                <option value="waiting">等待救援</option>
                <option value="rescuing">救援中</option>
                <option value="landed">已著陸</option>
                <option value="departed">已離開</option>
            </select>
        </div>
        <button class="btn btn-secondary" id="dbRefreshBtn"><i class="fas fa-sync-alt"></i> 刷新</button>
        <button class="btn btn-secondary" onclick="dbExportCSV()"><i class="fas fa-file-csv"></i> 匯出 CSV</button>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>車廂</th>
                    <th>姓名</th>
                    <th>聯絡方式</th>
                    <th>組別</th>
                    <th>健康狀況</th>
                    <th>救援開始</th>
                    <th>救援完成</th>
                    <th>離開時間</th>
                    <th>後續處理</th>
                    <th>狀態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="dbTableBody"></tbody>
        </table>
    </div>
</div>
