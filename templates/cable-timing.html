<h2 class="ct-title"><i class="fas fa-clock"></i> 纜車車距計算</h2>

<section class="ct-control-panel">
    <div class="ct-control-group">
        <label>面前車號</label>
        <input type="text" id="ct-inputCurrent" placeholder="例：42" />
    </div>
    <div class="ct-control-group">
        <label>目標車號</label>
        <input type="text" id="ct-inputTarget" placeholder="例：92" />
    </div>
    <div class="ct-control-group">
        <label>繩速 (m/s)</label>
        <input type="number" id="ct-inputSpeed" value="5.0" step="0.1" min="0" max="6" />
    </div>
    <div class="ct-control-group">
        <label>模式</label>
        <select id="ct-inputMode">
            <option value="109">109</option>
            <option value="84">84</option>
        </select>
    </div>
    <div class="ct-control-group">
        <label>站點位置（僅視覺）</label>
        <select id="ct-inputStation">
            <option value="TCT">TCT（東涌）</option>
            <option value="AIAS-U">AIAS-U（上行）</option>
            <option value="NLS-U">NLS-U（上行）</option>
            <option value="NPT">NPT（昂坪）</option>
            <option value="NLS-D">NLS-D（下行）</option>
            <option value="AIAS-D">AIAS-D（下行）</option>
        </select>
    </div>
    <button class="ct-btn ct-btn-primary" id="ct-btnCalculate">
        <i class="fas fa-calculator"></i> 計算行車時間
    </button>
    <button class="ct-btn ct-btn-secondary" id="ct-btnClearHighlight">
        <i class="fas fa-eraser"></i> 清除高亮
    </button>
</section>

<section class="ct-result-panel">
    <div class="ct-result-item">
        <span class="label">Gap（車距）</span>
        <span class="value" id="ct-resGap">—</span>
    </div>
    <div class="ct-result-item">
        <span class="label">秒／車廂</span>
        <span class="value" id="ct-resSecPerCar">—</span>
    </div>
    <div class="ct-result-item">
        <span class="label">總秒數</span>
        <span class="value" id="ct-resTotalSec">—</span>
    </div>
    <div class="ct-result-item">
        <span class="label">行車時間</span>
        <span class="value" id="ct-resTravelTime">—</span>
    </div>
    <div class="ct-result-item">
        <span class="label">預計到達</span>
        <span class="value" id="ct-resArrival">—</span>
    </div>
    <div class="ct-result-item">
        <span class="label">面前車位置</span>
        <span class="value" id="ct-resPosCurrent">—</span>
    </div>
    <div class="ct-result-item">
        <span class="label">目標車位置</span>
        <span class="value" id="ct-resPosTarget">—</span>
    </div>
</section>

<!-- 到各站時間 -->
<section class="ct-station-panel">
    <h3 class="ct-subtitle"><i class="fas fa-map-marker-alt"></i> 到各站預計時間</h3>
    <div class="ct-station-grid">
        <div class="ct-station-item">
            <span class="label">TCT（東涌）</span>
            <span class="value" id="ct-res-station-TCT">—</span>
        </div>
        <div class="ct-station-item">
            <span class="label">AIAS-U（上行）</span>
            <span class="value" id="ct-res-station-AIAS-U">—</span>
        </div>
        <div class="ct-station-item">
            <span class="label">NLS-U（上行）</span>
            <span class="value" id="ct-res-station-NLS-U">—</span>
        </div>
        <div class="ct-station-item">
            <span class="label">NPT（昂坪）</span>
            <span class="value" id="ct-res-station-NPT">—</span>
        </div>
        <div class="ct-station-item">
            <span class="label">NLS-D（下行）</span>
            <span class="value" id="ct-res-station-NLS-D">—</span>
        </div>
        <div class="ct-station-item">
            <span class="label">AIAS-D（下行）</span>
            <span class="value" id="ct-res-station-AIAS-D">—</span>
        </div>
    </div>
</section>
