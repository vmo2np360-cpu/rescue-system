<h2 style="color:#1e3a5f; margin-bottom:16px;">
    <i class="fas fa-user-plus"></i> Ground Support
</h2>

<div id="gsMessage" class="message"></div>

<!-- ================================================================ -->
<!-- ★ 進行中救援 Banner                                              -->
<!-- ================================================================ -->
<div id="gsOngoingBanner" class="gs-ongoing-banner" style="display:none;">
    <div class="gs-ongoing-header">
        ⚠️ 進行中的救援（<span id="gsOngoingCount">0</span> 筆）
    </div>
    <div id="gsOngoingList" class="gs-ongoing-list"></div>
</div>

<!-- ================================================================ -->
<!-- ★ 模式切換                                                       -->
<!-- ================================================================ -->
<div class="gs-mode-switch">
    <button id="gsModeStart" class="gs-mode-btn active" onclick="gsSwitchMode('start')">
        🟢 開始救援
    </button>
    <button id="gsModeComplete" class="gs-mode-btn" onclick="gsSwitchMode('complete')">
        🔵 完成救援
    </button>
    <button id="gsModeFull" class="gs-mode-btn" onclick="gsSwitchMode('full')">
        📋 完整表單
    </button>
</div>

<!-- ================================================================ -->
<!-- ★ 修改模式提示                                                   -->
<!-- ================================================================ -->
<div id="gsModifyBanner" class="gs-modify-banner" style="display:none;">
    <span class="gs-modify-text">✏️ 正在修改記錄</span>
    <button onclick="gsExitModifyMode()" class="gs-modify-cancel">取消修改</button>
</div>

<!-- ================================================================ -->
<!-- 主要表單                                                          -->
<!-- ================================================================ -->
<div class="card">
    <form id="gsForm" onsubmit="event.preventDefault(); gsSubmit();">

        <!-- ===== 共通欄位（全部模式顯示） ===== -->
        <div class="form-group">
            <label><i class="fas fa-cable-car"></i> 車廂號碼 <span style="color:#dc2626;">*</span></label>
            <input type="text" id="gsCabinNumber" placeholder="請輸入車廂號碼" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-users"></i> 組別 <span style="color:#dc2626;">*</span></label>
            <select id="gsGroupNumber" required>
                <option value="">請選擇</option>
                <option value="1">第1組</option>
                <option value="2">第2組</option>
                <option value="3">第3組</option>
                <option value="4">第4組</option>
                <option value="5">第5組</option>
                <option value="6">第6組</option>
                <option value="7">第7組</option>
                <option value="8">第8組</option>
                <option value="9">第9組</option>
                <option value="10">第10組</option>
                <option value="11">第11組</option>
                <option value="12">第12組</option>
                <option value="13">第13組</option>
                <option value="14">第14組</option>
                <option value="15">第15組</option>
                <option value="16">第16組</option>
                <option value="17">第17組</option>
            </select>
        </div>

        <!-- ===== 完成 / 完整模式才顯示 ===== -->
        <div class="form-group gs-complete-only">
            <label><i class="fas fa-user"></i> 被救者姓名</label>
            <input type="text" id="gsGuestName" placeholder="請輸入姓名">
        </div>

        <div class="form-group gs-complete-only">
            <label><i class="fas fa-phone"></i> 聯絡方式</label>
            <input type="text" id="gsContactNumber" placeholder="請輸入聯絡電話">
            <div style="margin-top:6px; display:flex; gap:8px; flex-wrap:wrap;">
                <button type="button" class="btn btn-secondary" style="padding:4px 10px; font-size:0.8rem;" onclick="setGsContact('未提供')">未提供</button>
                <button type="button" class="btn btn-secondary" style="padding:4px 10px; font-size:0.8rem;" onclick="toggleGsOtherContact()">其他</button>
                <label style="display:flex; align-items:center; gap:4px; font-size:0.8rem;">
                    <input type="checkbox" id="gsSmsOnly" onchange="toggleGsSmsSuffix()">
                    只能接收短信
                </label>
            </div>
            <div id="gsOtherContactContainer" style="display:none; margin-top:6px;">
                <input type="text" id="gsOtherContactInput" placeholder="請輸入其他聯絡方式">
            </div>
        </div>

        <div class="form-group gs-complete-only">
            <label><i class="fas fa-venus-mars"></i> 性別</label>
            <select id="gsGender">
                <option value="">請選擇</option>
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="form-group gs-complete-only">
            <label><i class="fas fa-birthday-cake"></i> 年齡</label>
            <select id="gsAgeRange">
                <option value="">請選擇</option>
                <option value="未能提供">未能提供</option>
                <option value="0-12">0-12歲</option>
                <option value="13-17">13-17歲</option>
                <option value="18-25">18-25歲</option>
                <option value="26-35">26-35歲</option>
                <option value="36-45">36-45歲</option>
                <option value="46-55">46-55歲</option>
                <option value="56-65">56-65歲</option>
                <option value="66+">66歲以上</option>
            </select>
        </div>

        <div class="form-group gs-complete-only">
            <label><i class="fas fa-heartbeat"></i> 健康狀況</label>
            <select id="gsHealthStatus">
                <option value="">請選擇</option>
                <option value="綠色(第三優先)">綠色_正常或傷勢較輕可自由走動</option>
                <option value="黃色(第二優先)">黃色_傷勢較為嚴重需緊急處理</option>
                <option value="紅色(第一優先)">紅色_有生命危險需立即搶救</option>
                <option value="黑色(沒有生命體徵)">黑色_(沒有生命體徵)</option>
                <option value="未能分類">未能分類</option>
            </select>
        </div>

        <div class="form-group gs-complete-only">
            <label><i class="fas fa-user-shield"></i> 救援者</label>
            <select id="gsRescuedBy">
                <option value="">請選擇</option>
                <option value="消防員">消防員</option>
                <option value="民安隊">民安隊</option>
                <option value="警察">警察</option>
                <option value="NP360職員">NP360職員</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="form-group gs-complete-only">
            <label><i class="fas fa-clock"></i> 完成救援時間 <span style="color:#dc2626;">*</span></label>
            <input type="datetime-local" id="gsTimeLanded">
        </div>

        <div class="form-group gs-complete-only">
            <label><i class="fas fa-sticky-note"></i> 備註</label>
            <textarea id="gsRemarks" rows="2" placeholder="請輸入備註"></textarea>
        </div>

        <!-- ===== 只有完整模式顯示 ===== -->
        <div class="form-group gs-full-only">
            <label><i class="fas fa-ambulance"></i> 救護車需求</label>
            <select id="gsAmbulance">
                <option value="">請選擇</option>
                <option value="不需要">不需要</option>
                <option value="需要">需要</option>
            </select>
        </div>

        <div class="form-group gs-full-only">
            <label><i class="fas fa-car"></i> 救護車車牌</label>
            <input type="text" id="gsAmbulancePlate" placeholder="請輸入車牌">
        </div>

        <div class="form-group gs-full-only">
            <label><i class="fas fa-hospital"></i> 醫院名稱</label>
            <input type="text" id="gsHospital" placeholder="請輸入醫院名稱">
        </div>

        <div class="form-group gs-full-only">
            <label><i class="fas fa-door-open"></i> 後續處理</label>
            <select id="gsExitMethod">
                <option value="">請選擇</option>
                <option value="正常或傷勢已處理 自行離開">正常或傷勢已處理 自行離開</option>
                <option value="現正在救援集合點休息中">現正在救援集合點休息中</option>
                <option value="已由救護車送往醫院">已由救護車送往醫院</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="form-group gs-full-only">
            <label><i class="fas fa-calendar-check"></i> 離場時間</label>
            <input type="datetime-local" id="gsExitTime">
        </div>

        <!-- ===== 提交按鈕 ===== -->
        <div class="modal-actions" style="margin-top:16px;">
            <button type="submit" id="gsSubmitBtn" class="btn btn-success">
                開始救援
            </button>
        </div>

    </form>
</div>

<!-- ================================================================ -->
<!-- 重複警告區塊（原有，用於完整表單模式）                            -->
<!-- ================================================================ -->
<div id="gsDuplicateWarning" class="card" style="display:none; background:#fef3c7; border:2px solid #eab308;">
    <div class="gs-duplicate-title" style="font-weight:700; color:#92400e; margin-bottom:8px;">
        ⚠️ 發現已存在的記錄
    </div>
    <div id="gsDuplicateList"></div>
    <div class="modal-actions" style="margin-top:12px;">
        <button type="button" class="btn btn-secondary" onclick="gsCancelDuplicate()">取消</button>
        <button type="button" class="btn btn-primary" onclick="gsCreateAnyway()">確定更新</button>
    </div>
</div>

<!-- ================================================================ -->
<!-- QR 結果區塊                                                       -->
<!-- ================================================================ -->
<div id="gsQrResult" class="card" style="display:none; margin-top:16px;">
    <h3 style="color:#1e3a5f; margin-bottom:12px;">✅ QR Code</h3>
    <div id="gsQrCode" style="display:flex; justify-content:center; margin:16px 0;"></div>
    <div style="text-align:center; font-size:0.9rem; color:#64748b; margin-bottom:12px;">
        <div>車廂：<span id="gsPrintCabin">-</span></div>
        <div>組別：<span id="gsPrintGroup">-</span></div>
    </div>
    <div class="modal-actions">
        <button type="button" class="btn btn-primary" onclick="gsSavePDF()">
            <i class="fas fa-file-pdf"></i> 下載 / 分享 PDF
        </button>
    </div>
</div>

<!-- ================================================================ -->
<!-- ★ 2 選項 Modal                                                   -->
<!-- ================================================================ -->
<div id="gsOverwriteModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title">⚠️ 已有完整記錄</span>
        </div>
        <p class="modal-message" style="margin-bottom:12px; color:#64748b;">
            此車廂 + 組別已有完整記錄，請選擇處理方式：
        </p>
        <div id="gsOverwriteInfo" style="background:#f8fafc; padding:10px; border-radius:6px; margin-bottom:16px; font-size:0.9rem;"></div>
        <div class="modal-actions" style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn-secondary" onclick="gsCancelOverwrite()">取消</button>
            <button type="button" class="btn btn-primary" onclick="gsChooseModify()">✏️ 修改內容</button>
            <button type="button" class="btn btn-danger" onclick="gsChooseFullRestart()">🔄 完全重新記錄</button>
        </div>
    </div>
</div>

<!-- ================================================================ -->
<!-- ★ 進行中 Modal                                                   -->
<!-- ================================================================ -->
<div id="gsOngoingModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title">⚠️ 此救援已在進行中</span>
        </div>
        <div id="gsOngoingInfo" style="background:#f8fafc; padding:10px; border-radius:6px; margin-bottom:16px; font-size:0.9rem;"></div>
        <p style="margin-bottom:12px; color:#64748b;">是否要覆蓋舊記錄？（會重設開始時間）</p>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="gsCancelOverwrite()">取消</button>
            <button type="button" class="btn btn-danger" onclick="gsConfirmOngoingOverwrite()">確定覆蓋</button>
        </div>
    </div>
</div>

<!-- ================================================================ -->
<!-- ★ 手動輸入開始時間 Modal                                          -->
<!-- ================================================================ -->
<div id="gsManualTimeModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title" id="gsManualTimeTitle">請輸入開始救援時間</span>
        </div>
        <p class="modal-message" id="gsManualTimeMessage" style="margin-bottom:12px; color:#64748b;"></p>
        <div class="form-group">
            <label>開始救援時間</label>
            <input type="datetime-local" id="gsManualTimeReachedTop">
        </div>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="gsCancelManualTime()">取消</button>
            <button type="button" class="btn btn-primary" onclick="gsConfirmManualTime()">確定</button>
        </div>
    </div>
</div>
