<!-- ============================================================ -->
<!-- monitor.html - 監控平台（深色三欄無滾動條，直立橢圓索道）    -->
<!-- 此內容會由 JavaScript 動態載入至 #section-monitor 容器內    -->
<!-- ============================================================ -->

<style>
    /* ----- 核心：僅在 active 時顯示 ----- */
    #section-monitor {
        display: none; /* 預設隱藏，由外層 .section-container 控制，但我們也確保 */
    }
    #section-monitor.active {
        display: flex !important;
        flex-direction: column;
        height: 100vh;
        padding: 0 !important;
        margin: 0 !important;
        background: #030a1e;
        color: #c8d6e5;
        border-radius: 0 !important;
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
    }
    #section-monitor * { box-sizing: border-box; }

    /* ----- 頂部 Header ----- */
    #mon-header {
        flex: 0 0 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: rgba(0, 243, 255, 0.04);
        border-bottom: 1px solid rgba(0, 243, 255, 0.2);
    }
    #mon-header h1 {
        font-size: 24px;
        color: #00f3ff;
        text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    #mon-header h1 i { color: #00f3ff; }
    #latestRescueMsg {
        font-size: 16px;
        color: #ffd93d;
        background: rgba(255, 217, 61, 0.1);
        padding: 6px 18px;
        border-radius: 30px;
        border: 1px solid rgba(255, 217, 61, 0.3);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    #latestRescueMsg .msg-label { color: #8899bb; font-weight: 300; }
    #latestMsgContent { font-weight: 600; }

    /* ----- 主體三欄 ----- */
    #mon-main {
        flex: 1;
        display: flex;
        overflow: hidden;
        gap: 0;
    }

    /* 左欄 (25%) */
    #mon-left {
        flex: 0 0 25%;
        display: flex;
        flex-direction: column;
        padding: 12px 14px;
        gap: 12px;
        border-right: 1px solid rgba(0, 243, 255, 0.12);
        overflow: hidden;
    }
    #mon-left .panel-box {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        padding: 12px 14px;
        border: 1px solid rgba(0, 243, 255, 0.08);
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    #mon-left .panel-box h3 {
        margin: 0 0 8px 0;
        font-size: 14px;
        color: #00f3ff;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }
    #mon-left .panel-box .content-scroll {
        flex: 1;
        overflow-y: auto;
        padding-right: 4px;
    }
    #mon-left .panel-box .content-scroll::-webkit-scrollbar { width: 3px; }
    #mon-left .panel-box .content-scroll::-webkit-scrollbar-track { background: transparent; }
    #mon-left .panel-box .content-scroll::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 4px; }

    /* 組別進度條 */
    .group-progress-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 13px;
    }
    .group-progress-item .gp-label {
        width: 48px;
        color: #c8d6e5;
        flex-shrink: 0;
    }
    .group-progress-item .gp-bar {
        flex: 1;
        height: 18px;
        background: #1a2a40;
        border-radius: 4px;
        overflow: hidden;
        display: flex;
    }
    .group-progress-item .gp-bar .gp-fill {
        height: 100%;
        background: #00f3ff;
        transition: width 0.4s;
        border-radius: 4px 0 0 4px;
    }
    .group-progress-item .gp-bar .gp-empty {
        height: 100%;
        background: #3a4a6a;
        flex: 1;
        border-radius: 0 4px 4px 0;
    }
    .group-progress-item .gp-count {
        width: 50px;
        text-align: right;
        color: #8899bb;
        font-size: 12px;
        flex-shrink: 0;
    }

    /* 健康小卡片 (左下半) */
    .health-mini-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        flex: 1;
    }
    .health-mini-card {
        background: rgba(255,255,255,0.05);
        border-radius: 6px;
        padding: 6px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .health-mini-card .hm-number {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
    }
    .health-mini-card .hm-label {
        font-size: 11px;
        color: #8899bb;
        margin-top: 2px;
    }

    /* 中央 (50%) */
    #mon-center {
        flex: 0 0 50%;
        display: flex;
        flex-direction: column;
        padding: 12px 14px;
        gap: 10px;
        overflow: hidden;
    }
    #mon-toolbar {
        flex: 0 0 44px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255,255,255,0.03);
        border-radius: 8px;
        padding: 0 14px;
        border: 1px solid rgba(0, 243, 255, 0.08);
        flex-shrink: 0;
    }
    #mon-toolbar .tool-label {
        color: #00f3ff;
        font-weight: 600;
        font-size: 14px;
    }
    #mon-toolbar #rescueTag {
        background: #ffd93d;
        color: #030a1e;
        padding: 2px 16px;
        border-radius: 30px;
        font-weight: 700;
        font-size: 13px;
    }
    #mon-toolbar .btn-mon {
        background: transparent;
        border: 1px solid rgba(0, 243, 255, 0.3);
        color: #c8d6e5;
        padding: 4px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    #mon-toolbar .btn-mon:hover {
        background: rgba(0, 243, 255, 0.1);
        border-color: #00f3ff;
    }
    #mon-toolbar .btn-mon.primary { border-color: #00f3ff; color: #00f3ff; }
    #mon-toolbar .auto-tip {
        margin-left: auto;
        color: #8899bb;
        font-size: 12px;
    }

    /* 地圖容器 */
    #mon-map-wrapper {
        flex: 1;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        border: 1px solid rgba(0, 243, 255, 0.1);
        overflow: hidden;
        position: relative;
        min-height: 0;
    }
    #monitorMap {
        width: 100%;
        height: 100%;
        display: block;
    }
    #monitorMap svg {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* 右欄 (25%) */
    #mon-right {
        flex: 0 0 25%;
        display: flex;
        flex-direction: column;
        padding: 12px 14px;
        gap: 12px;
        border-left: 1px solid rgba(0, 243, 255, 0.12);
        overflow: hidden;
    }
    #mon-right .panel-box {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        padding: 12px 14px;
        border: 1px solid rgba(0, 243, 255, 0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    #mon-right .panel-box h3 {
        margin: 0 0 6px 0;
        font-size: 14px;
        color: #00f3ff;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }
    #mon-right .stats-inline {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
        font-size: 13px;
        flex-shrink: 0;
    }
    #mon-right .stats-inline span {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
        border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    #mon-right .stats-inline strong { color: #fff; }

    .health-mini-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 4px;
        margin-top: 6px;
        flex-shrink: 0;
    }
    .health-mini-row .hmr-item {
        text-align: center;
        background: rgba(255,255,255,0.04);
        border-radius: 4px;
        padding: 4px 0;
    }
    .health-mini-row .hmr-item .num { font-size: 18px; font-weight: 700; }
    .health-mini-row .hmr-item .lbl { font-size: 10px; color: #8899bb; }

    /* 記錄表格 (右下半) */
    #mon-right .table-scroll {
        flex: 1;
        overflow-y: auto;
        margin-top: 6px;
    }
    #mon-right .table-scroll::-webkit-scrollbar { width: 3px; }
    #mon-right .table-scroll::-webkit-scrollbar-track { background: transparent; }
    #mon-right .table-scroll::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 4px; }
    #mon-right table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
    }
    #mon-right th {
        text-align: left;
        color: #8899bb;
        font-weight: 500;
        padding: 4px 6px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        position: sticky;
        top: 0;
        background: #030a1e;
        z-index: 2;
    }
    #mon-right td {
        padding: 4px 6px;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        color: #c8d6e5;
    }
    #mon-right .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
    }

    /* 自適應調整 (無滾動條，但內部可滾) */
    #mon-left .panel-box .content-scroll,
    #mon-right .table-scroll { scrollbar-width: thin; }

    /* 小工具 */
    .text-glow { text-shadow: 0 0 20px rgba(0,243,255,0.2); }
    .mt-1 { margin-top: 4px; }
    .mb-1 { margin-bottom: 4px; }

    /* 隱藏舊版殘留卡片（防干擾） */
    #section-monitor .card,
    #section-monitor .stats-grid,
    #section-monitor .health-grid,
    #section-monitor .filter-row,
    #section-monitor .chart-container,
    #section-monitor .map-toolbar,
    #section-monitor .summary-enhanced {
        display: none !important;
    }
    #section-monitor .message { margin: 0; }

    /* 修正：當 #section-monitor 隱藏時，內部所有元素也隱藏 */
    #section-monitor:not(.active) * {
        display: none !important;
    }
</style>

<!-- ===== 頁面結構（動態載入內容） ===== -->

<!-- 頂部 Header -->
<header id="mon-header">
    <h1><i class="fas fa-tv"></i> 救援分析實時監控平台</h1>
    <div id="latestRescueMsg">
        <span class="msg-label">🚨 最新救援</span>
        <span id="latestMsgContent">等待救援...</span>
    </div>
</header>

<!-- 主體三欄 -->
<main id="mon-main">

    <!-- 左欄 -->
    <aside id="mon-left">
        <!-- 組別救援狀態分佈 -->
        <div class="panel-box">
            <h3><i class="fas fa-layer-group"></i> 組別救援狀態</h3>
            <div class="content-scroll" id="groupProgressContainer">
                <!-- 動態由 JS 生成 -->
            </div>
        </div>
        <!-- OCC 求助記錄統計 + 健康狀況 -->
        <div class="panel-box">
            <h3><i class="fas fa-headset"></i> OCC 求助統計</h3>
            <div style="display:flex; gap:10px; flex-shrink:0; justify-content:space-around; margin-bottom:6px;">
                <div><span style="color:#8899bb;">總數</span><br><strong id="occ-total" style="font-size:20px; color:#fff;">0</strong></div>
                <div><span style="color:#8899bb;">待處理</span><br><strong id="occ-pending" style="font-size:20px; color:#ffd93d;">0</strong></div>
                <div><span style="color:#8899bb;">已完成</span><br><strong id="occ-processed" style="font-size:20px; color:#34a853;">0</strong></div>
            </div>
            <div class="health-mini-grid">
                <div class="health-mini-card"><div class="hm-number" style="color:#34a853;" id="occ-green-count">0</div><div class="hm-label">綠色</div></div>
                <div class="health-mini-card"><div class="hm-number" style="color:#f1c40f;" id="occ-yellow-count">0</div><div class="hm-label">黃色</div></div>
                <div class="health-mini-card"><div class="hm-number" style="color:#e74c3c;" id="occ-red-count">0</div><div class="hm-label">紅色</div></div>
                <div class="health-mini-card"><div class="hm-number" style="color:#5f6368;" id="occ-black-count">0</div><div class="hm-label">黑色</div></div>
            </div>
        </div>
    </aside>

    <!-- 中央 -->
    <section id="mon-center">
        <!-- 工具列 -->
        <div id="mon-toolbar">
            <span class="tool-label">📋 救援標籤</span>
            <span id="rescueTag">全區</span>
            <button class="btn-mon primary" onclick="monManualRefresh()"><i class="fas fa-sync-alt"></i> 刷新</button>
            <button class="btn-mon" onclick="monExportCSV()"><i class="fas fa-file-csv"></i> 匯出</button>
            <span class="auto-tip">⏱ 自動更新 20s</span>
            <!-- 搜尋框（高亮車廂） -->
            <input type="text" id="monSearchBox" placeholder="🔍 車廂號碼" style="background:rgba(255,255,255,0.06); border:1px solid rgba(0,243,255,0.2); border-radius:4px; padding:2px 8px; color:#fff; width:100px; font-size:12px;">
            <button class="btn-mon" onclick="monSearchCabin()" style="border-color:rgba(0,243,255,0.2); padding:2px 8px;">搜尋</button>
        </div>
        <!-- 地圖 -->
        <div id="mon-map-wrapper">
            <svg id="monitorMap" viewBox="0 0 2800 700" preserveAspectRatio="xMidYMid meet">
                <!-- 地圖內容會由 JavaScript 動態繪製 -->
            </svg>
        </div>
    </section>

    <!-- 右欄 -->
    <aside id="mon-right">
        <!-- 救援記錄統計 + 賓客健康 -->
        <div class="panel-box" style="flex:0 0 auto;">
            <h3><i class="fas fa-flag-checkered"></i> 救援統計</h3>
            <div class="stats-inline">
                <span>總記錄 <strong id="totalRecords">0</strong></span>
                <span>已完成 <strong id="completedRecords" style="color:#34a853;">0</strong></span>
                <span>處理中 <strong id="pendingRecords" style="color:#ffd93d;">0</strong></span>
                <span>需救護車 <strong id="ambulanceNeeded" style="color:#e74c3c;">0</strong></span>
            </div>
            <h3 style="margin-top:8px;"><i class="fas fa-heartbeat"></i> 賓客健康</h3>
            <div class="health-mini-row">
                <div class="hmr-item"><div class="num" style="color:#34a853;" id="green-count">0</div><div class="lbl">綠色</div></div>
                <div class="hmr-item"><div class="num" style="color:#f1c40f;" id="yellow-count">0</div><div class="lbl">黃色</div></div>
                <div class="hmr-item"><div class="num" style="color:#e74c3c;" id="red-count">0</div><div class="lbl">紅色</div></div>
                <div class="hmr-item"><div class="num" style="color:#5f6368;" id="black-count">0</div><div class="lbl">黑色</div></div>
            </div>
        </div>
        <!-- 救援記錄列表 -->
        <div class="panel-box" style="flex:1;">
            <h3 style="display:flex; justify-content:space-between;">
                <span><i class="fas fa-list-ul"></i> 救援記錄</span>
                <input type="text" id="searchInput" placeholder="搜尋..." style="background:rgba(255,255,255,0.06); border:1px solid rgba(0,243,255,0.2); border-radius:4px; padding:2px 8px; color:#fff; width:100px; font-size:12px;" oninput="monFilterRecords()">
            </h3>
            <div class="table-scroll">
                <table>
                    <thead><tr><th>車廂</th><th>姓名</th><th>狀態</th></tr></thead>
                    <tbody id="monitor-records-list"></tbody>
                </table>
            </div>
        </div>
    </aside>

</main>

<!-- 隱藏輔助元素（保留原 id 供 JS 更新時間戳） -->
<div style="display:none;">
    <span id="last-map-update"></span>
    <span id="last-data-update"></span>
    <span id="last-chart-update"></span>
    <span id="last-monitor-update"></span>
</div>

<!-- 圖表容器（若需要保留救援時間分佈圖，請取消註解下方區塊，並在 monitor.js 中補上 canvas 繪圖邏輯） -->

    <canvas id="timeChart"></canvas>
