<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纜車救援管理系統</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 外部庫 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 共用庫與模組 -->
    <script src="common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/gs.js"></script>
    <script src="js/ap.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/map.js"></script>
    <script src="js/occ.js"></script>
    <script src="js/monitor.js"></script>
    <script src="js/audit.js"></script>
</head>
<body>

<!-- 載入遮罩 -->
<div id="global-loader"><div class="loader-content"><i class="fas fa-spinner fa-pulse"></i><p>處理中...</p></div></div>

<div class="app-container">
    <!-- 導航列 -->
    <div id="navbar" class="navbar" style="display:none;">
        <div class="navbar-brand"><i class="fas fa-cable-car"></i><span>救援管理系統</span></div>
        <div class="navbar-menu" id="navMenu"></div>
        <div class="navbar-user">
            <span id="navUserInfo">使用者</span>
            <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> 登出</button>
        </div>
    </div>

    <!-- 登入表單 -->
    <div id="loginContainer">
        <div class="login-wrapper">
            <div class="login-title"><i class="fas fa-user-lock" style="color:#2563eb;"></i> 登入系統</div>
            <div class="login-sub">選擇角色並輸入密碼</div>
            <div id="loginMessage" class="message"></div>
            <div class="form-group">
                <label for="roleSelect"><i class="fas fa-user-tag"></i> 角色</label>
                <select id="roleSelect" onchange="onRoleChange()">
                    <option value="">— 請選擇 —</option>
                    <option value="admin">管理員 (Admin)</option>
                    <option value="gs">地面救援隊 (GS)</option>
                    <option value="ap">集合點 (AP)</option>
                    <option value="occ">OCC 控制中心</option>
                    <option value="re">監控數據 (RE)</option>
                    <option value="gr">賓客關係 (GR)</option>
                </select>
            </div>
            <input type="hidden" id="loginEmail" value="">
            <div class="form-group" style="position: relative;">
                <label for="loginPassword"><i class="fas fa-lock"></i> 密碼</label>
                <input type="password" id="loginPassword" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter') handleLogin()" style="padding-right: 40px;">
                <span onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; top: 42px; cursor: pointer; color: #64748b;">
                    <i id="pwdToggleIcon" class="fas fa-eye"></i>
                </span>
            </div>
            <div id="loginHint" class="login-hint">請選擇角色</div>
            <button class="btn-primary" onclick="handleLogin()"><i class="fas fa-sign-in-alt"></i> 登入系統</button>
        </div>
    </div>

    <!-- ===== 六個區塊容器（空，由動態載入填充） ===== -->
    <div id="section-gs" class="section-container"></div>
    <div id="section-ap" class="section-container"></div>
    <div id="section-dashboard" class="section-container"></div>
    <div id="section-map" class="section-container"></div>
    <div id="section-occ" class="section-container"></div>
    <div id="section-monitor" class="section-container"></div>
    <div id="section-audit" class="section-container"></div>
</div>

<!-- ===== 全局模態框 ===== -->

<!-- 車廂資訊模態框 -->
<div id="cabinModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><span class="modal-title">車廂資訊</span><button class="modal-close" onclick="closeCabinModal()">&times;</button></div>
        <form id="cabinForm">
            <div class="form-group"><label>車廂號碼</label><input name="sequence" id="cabinSeq" required></div>
            <div class="form-group"><label>開始救援時間</label><input type="datetime-local" name="timeReachedTop" id="cabinTimeReachedTop"></div>
            <div class="form-group"><label>完成救援時間</label><input type="datetime-local" name="timeLanded" id="cabinTimeLanded"></div>
            <div class="form-group"><label>備註</label><textarea name="remarks" id="cabinRemarks"></textarea></div>
            <div class="modal-actions">
                <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> 儲存</button>
                <button type="button" class="btn btn-secondary" onclick="closeCabinModal()">取消</button>
            </div>
        </form>
    </div>
</div>

<!-- 組別詳情模態框 (完整表單) -->
<div id="groupModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><span class="modal-title">組別詳情</span><button class="modal-close" onclick="closeGroupModal()">&times;</button></div>
        <form id="groupForm">
            <input type="hidden" id="groupDocId" name="docId">
            <input type="hidden" id="groupCabinNumber" name="cabinNumber">
            
            <div class="form-group"><label>組別</label><select id="groupGroupNumber" name="groupNumber" required>
                <option value="">請選擇</option>
                <option value="1">第1組</option><option value="2">第2組</option>
                <option value="3">第3組</option><option value="4">第4組</option>
                <option value="5">第5組</option><option value="6">第6組</option>
                <option value="7">第7組</option><option value="8">第8組</option>
                <option value="9">第9組</option><option value="10">第10組</option>
                <option value="11">第11組</option><option value="12">第12組</option>
                <option value="13">第13組</option><option value="14">第14組</option>
                <option value="15">第15組</option><option value="16">第16組</option>
                <option value="17">第17組</option>
            </select></div>
            
            <div class="form-group"><label>被救者姓名</label><input type="text" id="groupGuestName" name="guestName" placeholder="請輸入姓名"></div>
            
            <div class="form-group"><label>聯絡方式</label><input type="text" id="groupContactNumber" name="contactNumber" placeholder="請輸入聯絡電話"></div>
            
            <div class="form-group"><label>性別</label>
                <select id="groupGender" name="gender">
                    <option value="">請選擇</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            
            <div class="form-group"><label>年齡</label>
                <select id="groupAgeRange" name="ageRange">
                    <option value="">請選擇</option>
                    <option value="未能提供">未能提供</option>
                    <option value="0-12">0-12歲</option>
                    <option value="13-17">13-17歲</option>
                    <option value="18-25">18-25歲</option>
                    <option value="26-35">26-35歲</option>
                    <option value="36-45">36-45歲</option>
                    <option value="46-55">46-55歲</option>
                    <option value="56-65">56-65歲</option>
                    <option value="66+">66歲以上</option>
                </select>
            </div>
            
            <div class="form-group"><label>健康狀況</label>
                <select id="groupHealthStatus" name="healthStatus">
                    <option value="">請選擇</option>
                    <option value="綠色(第三優先)">綠色_正常或傷勢較輕可自由走動</option>
                    <option value="黃色(第二優先)">黃色_傷勢較為嚴重需緊急處理</option>
                    <option value="紅色(第一優先)">紅色_有生命危險需立即搶救</option>
                    <option value="黑色(沒有生命體徵)">黑色_(沒有生命體徵)</option>
                    <option value="未能分類">未能分類</option>
                </select>
            </div>
            
            <div class="form-group"><label>救護車需求</label>
                <select id="groupAmbulance" name="ambulance" onchange="toggleGroupAmbulanceFields()">
                    <option value="">請選擇</option>
                    <option value="不需要">不需要</option>
                    <option value="需要">需要</option>
                </select>
            </div>
            
            <div id="groupAmbulanceFields" style="display:none;">
                <div class="form-group"><label>救護車車牌</label><input type="text" id="groupAmbulancePlate" name="ambulancePlate" placeholder="請輸入車牌"></div>
                <div class="form-group"><label>醫院名稱</label><input type="text" id="groupHospital" name="hospital" placeholder="請輸入醫院名稱"></div>
            </div>
            
            <div class="form-group"><label>後續處理</label>
                <select id="groupExitMethod" name="exitMethod" onchange="toggleGroupOtherExit()">
                    <option value="">請選擇</option>
                    <option value="正常或傷勢已處理 自行離開">正常或傷勢已處理 自行離開</option>
                    <option value="現正在救援集合點休息中">現正在救援集合點休息中</option>
                    <option value="已由救護車送往醫院">已由救護車送往醫院</option>
                    <option value="其他">其他</option>
                </select>
                <div id="groupOtherExitContainer" style="display:none; margin-top:8px;">
                    <input type="text" id="groupOtherExitInput" placeholder="請輸入其他後續處理方式">
                </div>
            </div>
            
            <div class="form-group"><label>離場時間</label><input type="datetime-local" id="groupExitTime" name="exitTime"></div>
            
            <div class="form-group"><label>救援人員</label>
                <select id="groupRescuedBy" name="rescuedBy" onchange="toggleGroupOtherRescuer()">
                    <option value="">請選擇</option>
                    <option value="消防員">消防員</option>
                    <option value="民安隊">民安隊</option>
                    <option value="警察">警察</option>
                    <option value="NP360職員">NP360職員</option>
                    <option value="其他">其他</option>
                </select>
                <div id="groupOtherRescuerContainer" style="display:none; margin-top:8px;">
                    <input type="text" id="groupOtherRescuerInput" placeholder="請輸入其他救援人員">
                </div>
            </div>
            
            <div class="form-group"><label>開始救援時間</label><input type="datetime-local" id="groupTimeReachedTop" name="timeReachedTop"></div>
            <div class="form-group"><label>完成救援時間</label><input type="datetime-local" id="groupTimeLanded" name="timeLanded"></div>
            
            <div class="form-group"><label>備註</label><textarea id="groupRemarks" name="remarks" rows="2"></textarea></div>
            
            <div id="group-qrcode"></div>
            
            <div class="modal-actions">
                <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> 儲存</button>
                <button type="button" class="btn btn-secondary" onclick="closeGroupModal()">取消</button>
                <button type="button" class="btn btn-danger" onclick="deleteGroupRecord()" style="background:#dc2626;color:white;">刪除</button>
            </div>
        </form>
    </div>
</div>

<script>
     document.addEventListener('DOMContentLoaded', function() {
        console.log('✅ 動態載入模式已啟動，區塊將在切換時載入。');

        // ============================================================
        // ★ 在此加入地圖初始化邏輯（確保地圖區塊顯示時自動載入）
        // ============================================================
        function tryInitMap() {
            var mapSection = document.getElementById('section-map');
            // 如果地圖區塊存在且是顯示狀態（或是預設顯示），就初始化地圖
            if (mapSection && mapSection.style.display !== 'none') {
                if (typeof initMap === 'function') {
                    console.log('📍 偵測到地圖區塊，初始化地圖...');
                    setTimeout(initMap, 300); // 延遲 300ms 確保 DOM 完整渲染
                }
            }
        }

        // 初次載入嘗試
        tryInitMap();

        // 如果有導航切換事件，也可在此監聽（視您的架構而定）
        // 但通常導航切換會在 auth.js 中處理，請參考下方「位置二」說明
    });
</script>
</body>
</html>
